# 안드로이드 빌드를 EAS 클라우드에 맡긴다. PC에 Node를 깔 필요가 없다.
# 필요한 것: 저장소 Settings > Secrets and variables > Actions 에 EXPO_TOKEN (expo.dev > Account settings > Access tokens)
# 실행 방법
#   1) Actions 탭 > "Android build" > Run workflow 에서 프로필 선택
#   2) 태그 푸시: android-preview-* 는 폰 설치용 APK, android-release-* 는 스토어용 AAB
name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview = 폰 설치용 APK, production = 스토어용 AAB"
        type: choice
        options: [preview, production]
        default: preview
  push:
    tags:
      - "android-preview-*"
      - "android-release-*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: EXPO_TOKEN 확인
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::저장소 시크릿 EXPO_TOKEN 이 없습니다. expo.dev 에서 액세스 토큰을 만들어 넣어 주세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: 게임 HTML 내장 파일 만들기
        run: npm run build:game

      - name: 테스트
        run: npx tsc --noEmit

      - name: 빌드 프로필 정하기
        id: prof
        run: |
          P="${{ github.event.inputs.profile }}"
          case "$GITHUB_REF_NAME" in android-release-*) P=production;; android-preview-*) P=preview;; esac
          echo "profile=${P:-preview}" >> "$GITHUB_OUTPUT"

      - name: EAS 프로젝트 연결
        run: eas init --non-interactive --force

      - name: EAS 빌드
        run: eas build --platform android --profile ${{ steps.prof.outputs.profile }} --non-interactive --wait --json > build.json

      - name: 결과 링크
        if: always()
        run: |
          if [ -s build.json ]; then
            node -e 'const b=JSON.parse(require("fs").readFileSync("build.json","utf8"))[0]||{};
              const u=(b.artifacts||{}).buildUrl||(b.artifacts||{}).applicationArchiveUrl||"";
              console.log("상태:",b.status); console.log("파일:",u);
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                `## 안드로이드 빌드 (${b.buildProfile||""})\n\n- 상태: ${b.status}\n- 파일: ${u}\n- 상세: https://expo.dev/accounts/${b.project&&b.project.ownerAccount&&b.project.ownerAccount.name}/projects/newbie-quest/builds/${b.id}\n`);'
          fi
